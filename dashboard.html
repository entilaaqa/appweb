<style>
:root{--bg:#f3f1ec;--card:#fbfaf7;--fg:#141414;--mut:#6d6b64;--line:#e6e2d9;--soft:#efece4;--cream:#ece3cf;--hot:#b42318;--warn:#a15c00;--ok:#157347;
--k1:#e2ebe3;--k2:#f4e6d1;--k3:#e1e8f0;--k4:#f1dfd8;--side:#101010;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0a;--card:#141414;--fg:#f5f3ee;--mut:#a09d94;--line:#262626;--soft:#1b1b1b;--hot:#f87171;--warn:#fbbf24;--ok:#4ade80;--k1:#18251c;--k2:#2a2216;--k3:#18212f;--k4:#2a1d19;--side:#141414;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0a0a;--card:#141414;--fg:#f5f3ee;--mut:#a09d94;--line:#262626;--soft:#1b1b1b;--hot:#f87171;--warn:#fbbf24;--ok:#4ade80;--k1:#18251c;--k2:#2a2216;--k3:#18212f;--k4:#2a1d19;--side:#141414;color-scheme:dark}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;display:grid;grid-template-columns:272px minmax(0,1fr);gap:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* sidebar */
.side{background:var(--side);color:#e9e7e1;margin:16px;border-radius:30px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;height:calc(100vh - 32px);height:calc(100dvh - 32px);overflow:auto}
.dk .side,:root[data-theme=dark] .side{border:1px solid #262626}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 14px}.brand .lg{width:46px;height:46px;border-radius:14px;background:var(--cream);display:grid;place-items:center;flex:none}.brand .lg svg{width:26px;height:26px}
.brand b{display:block;font:700 20px/1.2 "IBM Plex Sans Arabic";color:#fff}.brand span{font-size:13px;color:#9a978f}
.nav{display:flex;flex-direction:column;gap:3px}.nav .gt{font:600 11px Montserrat,sans-serif;letter-spacing:.12em;color:#6f6c65;padding:16px 14px 6px}
.nav a,.fl a,.fl button{display:flex;align-items:center;gap:12px;color:#c9c6bd;text-decoration:none;padding:11px 14px;border-radius:16px;background:none;border:0;cursor:pointer;text-align:start;width:100%}
.nav a:hover,.fl a:hover,.fl button:hover{background:#1c1c1c;color:#fff}.nav a.on{background:var(--cream);color:#101010;font-weight:600}
.nav a span.l{display:flex;align-items:center;gap:12px;flex:1}
.side svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav b{background:#2a2a2a;color:#fff;border-radius:99px;font:600 12px Montserrat,sans-serif;padding:1px 9px}.nav a.on b{background:#101010;color:#fff}
.fl{margin-top:auto;border-top:1px solid #262626;padding-top:10px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 2px}.me .a{width:40px;height:40px;border-radius:50%;background:var(--cream);color:#101010;display:grid;place-items:center;font:700 16px Montserrat,sans-serif;flex:none}
.me b{display:block;color:#fff;font-weight:600;font-size:14px;line-height:1.3}.me span{font-size:12px;color:#9a978f;word-break:break-all;display:block;line-height:1.3}
/* content */
.cont{min-width:0;padding:16px 10px 40px 26px}
.tb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.srch{position:relative;flex:1;min-width:230px;max-width:560px}.srch input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:13px 48px 13px 70px;font-size:14px}
.srch svg{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round}
.srch kbd{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);font:600 11px Montserrat,sans-serif;background:var(--soft);border-radius:8px;padding:2px 8px;color:var(--mut);direction:ltr}
.tb .sp{margin-inline-start:auto}.clk{font-size:13px;color:var(--mut);text-align:end;line-height:1.35}.clk b{display:block;color:var(--fg);font:700 15px Montserrat,sans-serif;direction:ltr}
.ib{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;text-decoration:none;color:var(--fg)}.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .n{position:absolute;top:-2px;inset-inline-end:-2px;background:var(--hot);color:#fff;border-radius:99px;font:700 11px Montserrat,sans-serif;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.ib.av{background:var(--fg);color:var(--bg);font:700 17px Montserrat,sans-serif;border:0}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.btn.dk{background:var(--fg);color:var(--bg);border-color:var(--fg)}.btn.ac{background:#1d1d1d;color:#fff;border-color:#1d1d1d}
main{padding-top:6px}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin:26px 0 22px}.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.15;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}.hero p{margin:0;color:var(--mut);max-width:640px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}.hero .btn b{background:var(--soft);color:var(--fg);border-radius:99px;padding:0 9px;font:700 12px Montserrat,sans-serif}.btn.dk b{background:#2a2a2a;color:#fff}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:24px 0 18px}.top h1{font-size:34px;line-height:1.2;font-weight:600;margin:0;margin-inline-end:auto}
.mut{color:var(--mut)}.sec{margin-top:22px}
/* kpis */
.kp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kp{border-radius:26px;padding:18px 20px;position:relative;overflow:hidden;min-height:132px;color:#141414}.kp.k1{background:var(--k1)}.kp.k2{background:var(--k2)}.kp.k3{background:var(--k3)}.kp.k4{background:var(--k4)}
:root[data-theme=dark] .kp{color:var(--fg)}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .kp{color:var(--fg)}}
.kp span.t{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.8}.kp b.v{display:block;font:700 32px/1.3 Montserrat,sans-serif;margin-top:6px;unicode-bidi:isolate}.kp small{display:block;opacity:.75;font-size:13px}
.kp svg.sk{position:absolute;left:16px;top:46px;width:34%;height:44px;direction:ltr}.kp svg.sk polyline{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.65}
.dl{font-weight:700}.dl.u{color:var(--ok)}.dl.d{color:var(--hot)}
/* cards */
.g2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:18px;align-items:start}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.stk{display:flex;flex-direction:column;gap:18px}
.card2,.box{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;min-width:0}
.chead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}.chead h2,h2{font-size:18px;margin:0;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}h2 small{font-weight:400;color:var(--mut);font-size:13px}.chead small{display:block;color:var(--mut);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:auto;max-width:100%;background:var(--soft);padding:4px;gap:2px}.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:14px}.seg .on{background:var(--fg);color:var(--bg);font-weight:600}
.stage{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.5fr);gap:20px}
.spot{background:linear-gradient(160deg,var(--soft),var(--cream));border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:380px;color:#141414;position:relative}
.chip{align-self:flex-start;background:#141414;color:#fff;border-radius:99px;padding:6px 14px;font-size:13px}
.bigav{width:96px;height:96px;border-radius:30px;background:#141414;color:var(--cream);display:grid;place-items:center;font:800 44px Montserrat,"IBM Plex Sans Arabic",sans-serif;margin:14px 0 4px}
.spot b{font-size:22px;line-height:1.3;display:block}.spot p{margin:4px 0 0;font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.spot .mut{color:#5d5a52}
.arrows{display:flex;gap:8px;margin-top:auto}.arrows button{width:40px;height:40px;border-radius:50%;border:0;background:#fbfaf7;cursor:pointer;font-size:18px;color:#141414}
.rph{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.rph h3{margin:0;font-size:22px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.tile{border:1px solid var(--line);border-radius:18px;padding:12px 14px}.tile span{font-size:13px;color:var(--mut);display:block}.tile b{font:700 22px Montserrat,sans-serif;direction:ltr;display:block;text-align:start}
svg.ch{width:100%;height:190px;display:block;direction:ltr}svg.ch text{fill:var(--mut);font:11px Montserrat,sans-serif}svg.ch .ln{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round}svg.ch .ar{fill:var(--fg);opacity:.07}svg.ch .gr{stroke:var(--line);stroke-width:1}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.pill{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:7px 14px 7px 12px;cursor:pointer;font-size:14px}.pill i{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font:700 13px Montserrat,sans-serif;font-style:normal}.pill.on{background:#141414;color:#fff;border-color:#141414}.pill.on i{background:#2d2d2d}
.rpf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dark{background:#141a16;background:#0f0f0f;color:#f1efe8;border-radius:28px;padding:22px;border:1px solid #232323}
.dark h2{color:#fff}.dark .mut{color:#9a978f}.live{font-size:13px;display:flex;align-items:center;gap:6px}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cream)}
.rg{display:flex;align-items:center;gap:22px;margin:18px 0;flex-wrap:wrap}.rg svg{width:116px;height:116px;flex:none}.rg .c{font:700 26px Montserrat,sans-serif;direction:ltr}.cd{font:700 36px/1.2 Montserrat,sans-serif;direction:ltr;text-align:end}
.dark .btn{background:var(--cream);color:#141414;border-color:var(--cream)}.dark .lnk{background:none;border:0;color:#e8e4d8;cursor:pointer;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer}.item+.item{border-top:1px solid var(--line)}.item .ic{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font:700 15px Montserrat,sans-serif;flex:none}.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-weight:500}.item small{color:var(--mut);display:block}.item .pg{width:70px;height:7px;border-radius:9px;background:var(--soft);overflow:hidden;flex:none}.item .pg s{display:block;height:100%;border-radius:9px}
.arw{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--fg);text-decoration:none}.arw svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{margin-bottom:12px}.bar div{display:flex;justify-content:space-between;font-size:14px;gap:8px}.bar i{display:block;height:7px;border-radius:9px;background:var(--soft);margin-top:5px;overflow:hidden}.bar s{display:block;height:100%;background:var(--fg);border-radius:9px}
input,select,textarea{font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px}input[type=search]{min-width:230px;border-radius:999px}textarea{width:100%;min-height:96px;resize:vertical}
.tag{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:0 9px;font-size:12px;font-weight:600;white-space:nowrap}.t3{color:var(--hot)}.t2{color:var(--warn)}.t1{color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.kb{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--soft);border-radius:22px;padding:12px;min-height:160px}.col.ov{outline:2px dashed var(--fg)}.col h3{font-size:14px;margin:2px 4px 12px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:grab}.card:hover{border-color:var(--fg)}.card b{display:block}.card div{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:13px;color:var(--mut);align-items:center}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:22px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--soft);font-size:13px;color:var(--mut);font-weight:600}tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}tr:last-child td{border:0}
.empty{padding:30px;text-align:center;color:var(--mut)}
.dr{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}.dr.on{display:block}
.pn{position:absolute;inset-block:0;inset-inline-start:0;width:min(460px,100%);background:var(--card);padding:22px;overflow:auto}.pn h2{font-size:22px;margin:12px 0 2px;display:block}
dl{margin:14px 0}dt{color:var(--mut);font-size:13px;margin-top:12px}dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.toast{position:fixed;inset-inline-end:20px;bottom:20px;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:30;font-size:14px;max-width:340px}
.note{border:1px solid var(--warn);color:var(--warn);border-radius:14px;padding:10px 14px;margin-top:6px;font-size:14px}
.av{width:64px;height:64px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:800 26px Montserrat,sans-serif;flex:none}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs a{color:var(--mut);text-decoration:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px}.tabs a.on{background:var(--fg);color:var(--bg)}.crumb{color:var(--mut);font-size:13px}
@media(max-width:1200px){.kp4,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.stage{grid-template-columns:1fr}.spot{min-height:300px}}
@media(max-width:900px){body{grid-template-columns:1fr}.side{position:static;height:auto;margin:10px;border-radius:24px;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.brand{padding:0}.nav{flex-direction:row;flex:1;overflow-x:auto}.nav .gt,.fl .me{display:none}.fl{margin:0;border:0;padding:0;flex-direction:row}.cont{padding:6px 14px 30px}.pf{grid-template-columns:1fr}.clk{display:none}.tiles{grid-template-columns:1fr 1fr}.brand span{display:none}}
@media(max-width:560px){.kp4,.g4{grid-template-columns:1fr}}
</style>
</head>
