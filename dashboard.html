<style>

<script>

  p.append(dl);$("#dr").classList.add("on");close.focus();

function csv(rows){
  const c=["created_at","name","whatsapp","email","lead_status","current_status","monthly_income","ready_to_invest","main_goal","biggest_challenge","notes","session_start","country","referrer"];

function chart(list,n){
  const t0=new Date();t0.setHours(0,0,0,0);const cnt=Array(n).fill(0);
  list.forEach(b=>{const d=Math.round((t0-new Date(new Date(b.created_at).setHours(0,0,0,0)))/864e5);if(d>=0&&d<n)cnt[n-1-d]++});

  cnt.forEach((c,i)=>{const bh=c?Math.max(4,c/mx*H):2;s+=`<rect class="${c?"":"z"}" x="${i*bw+g}" y="${H-bh}" width="${bw-2*g}" height="${bh}" rx="2"><title>${c}</title></rect>`});

function bars(list,title,fn,max){

  const es=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,max||6);

function overview(){

  [["الحجوزات",cur.length,dl(cur.length,prev.length)],["عملاء مميّزون",hot(cur),dl(hot(cur),hot(prev))],["جاهزون للاستثمار",rdy(cur)+"%",dl(rdy(cur),rdy(prev))],["تم التعاقد",won(cur),dl(won(cur),won(prev))]].forEach(([l,v,d])=>kp.append(h("div","kpi",h("span",null,l),h("b",null,v),d)));

  m.append(head("نظرة عامة",rs),kp,h("div","g2 sec",ch,tb),h("div","g3 sec",fn,bars(cur,"توزيع الدخل الشهري",b=>b.monthly_income),bars(cur,"مصدر الزيارات",src)),h("div","g3 sec",bars(cur,"الوضع الحالي",b=>b.current_status),bars(cur,"الجاهزية للاستثمار",b=>b.ready_to_invest),bars(cur,"الدول",b=>b.country)));
}
function leads(){
  const m=$("#m");m.textContent="";
  const q=h("input");q.type="search";q.placeholder="ابحث بالاسم أو الرقم أو البريد";q.value=QS;q.setAttribute("aria-label","بحث");
  const sq=h("select");sq.setAttribute("aria-label","الجودة");[["","كل الجودات"],["3","مميّز"],["2","محتمل"],["1","أولي"]].forEach(([v,t])=>{const o=h("option",null,t);o.value=v;sq.append(o)});sq.value=QF;

    if(VIEW==="board"){const kb=h("div","kb");
      ST.forEach(([k,t,c])=>{const L=cur.filter(b=>stOf(b)===k),col=h("div","col",h("h3",null,h("span",null,h("span","dot"),t),h("span","mut",L.length)));col.querySelector(".dot").style.background=c;
        col.ondragover=e=>{e.preventDefault();col.classList.add("ov")};col.ondragleave=()=>col.classList.remove("ov");
