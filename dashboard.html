const nextPay=i=>data.Y.filter(y=>y.p===i&&y.st!=="paid").sort((a,b)=>a.at-b.at)[0];
const sdPanel=()=>{if(!sel)return `<div class="sd"><div class="h">${t().hint}</div></div>`;const l=data.P.filter(p=>p.s===sel);
return `<div class="sd"><div class="h"><b>${t().stg[sel-1]}</b> · ${l.length}</div>${l.map(p=>{const i=data.P.indexOf(p),pd=paidOf(i),dl=Math.round((p.at+365*864e5-Date.now())/864e5),n=nextPay(i);
return `<div class="sdi"><div><b>${esc(p.n)}</b><div class="m">${esc(p.c)}</div></div><div><div class="m">${t().paid}: <span class="ltr">${money(pd)} ${t().of} ${money(p.t)}</span></div><div class="bar"><i style="width:${Math.round(pd/p.t*100)}%"></i></div></div><div><div class="m">${t().nxt}</div>${n?`<b class="ltr">${money(n.a)}</b> · ${dt(n.at)}`:t().nonx}<div class="m" style="color:${dl<0?"var(--bad)":"var(--mut)"}">${dl<0?t().ovr:dl+" "+t().left}</div></div></div>`}).join("")}</div>`};
const track=()=>{const c=Array(7).fill(0);data.P.forEach(p=>c[p.s-1]++);return `<div class="rm" id="trk"><div class="rh"><span class="live"></span>${t().trk}</div><div class="s" style="font-size:13px;color:var(--mut)">${t().trkS}</div><div class="rt"><div class="rl"></div>${t().stg.map((n,i)=>`<button type="button" class="st${c[i]?" has":""}${sel===i+1?" sel":""}" data-s="${i+1}"${c[i]?"":" disabled"} aria-pressed="${sel===i+1}"><div class="nd">${c[i]||i+1}</div><span>${n}</span></button>`).join("")}</div>${sdPanel()}</div>`};
function chart(){const now=new Date(),m=[];for(let i=5;i>=0;i--){const a=new Date(now.getFullYear(),now.getMonth()-i,1),b=new Date(now.getFullYear(),now.getMonth()-i+1,1);m.push({l:a.toLocaleDateString("en-US",{month:"short"}),v:data.Y.filter(y=>y.st==="paid"&&y.at>=+a&&y.at<+b).reduce((s,y)=>s+y.a,0)})}
const mx=Math.max(1000,...m.map(x=>x.v)),w=520,h=190,bw=46,gap=(w-m.length*bw)/(m.length+1);
return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t().rev}" style="width:100%;height:auto;direction:ltr"><line class="z" x1="0" x2="${w}" y1="150" y2="150"/>${m.map((x,i)=>{const bh=x.v/mx*120,X=gap+i*(bw+gap);return `<rect class="b" x="${X}" y="${150-bh}" width="${bw}" height="${Math.max(bh,x.v?3:0)}" rx="8"/><text x="${X+bw/2}" y="172" text-anchor="middle">${x.l}</text>${x.v?`<text x="${X+bw/2}" y="${144-bh}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${(x.v/1000).toFixed(1)}k</text>`:""}`}).join("")}</svg>`}
const rows=(list)=>list.map(b=>`<tr><td><b>${esc(b.name)}</b><div style="font-size:12px;color:var(--mut)" class="ltr">${esc(b.mail)}</div></td><td><span class="ltr">${esc(b.wa)}</span></td><td>${t().inc[b.inc]||"–"}</td><td>${t().rdy[b.rdy]||"–"}</td><td>${selSt(b)}</td><td>${dt(b.at)}</td></tr>`).join("");
const selSt=b=>`<select data-id="${b.id}" class="p-${b.st}" aria-label="status">${Object.entries(t().sts).map(([k,v])=>`<option value="${k}"${k===b.st?" selected":""}>${v}</option>`).join("")}</select>`;
const V={
ov(){const n30=data.B.filter(b=>b.at>=D(30)).length,act=data.P.filter(p=>p.s<7).length,col=data.Y.filter(y=>y.st==="paid").reduce((a,y)=>a+y.a,0),rd=data.B.length?Math.round(data.B.filter(b=>b.rdy===0).length/data.B.length*100):0;
const k=[n30,act,money(col),rd+"%"];
return `<div class="g g4">${k.map((v,i)=>`<div class="c kpi"><b>${v}</b><span>${t().kpi[i]}</span></div>`).join("")}</div><div class="mt">${track()}</div>
<div class="g g2 mt"><div class="c" id="rv"><h2>${t().rev}</h2><div class="s">${t().revS}</div>${chart()}</div><div class="c" id="lt"><h2>${t().late}</h2><div class="s"></div>${[...data.B].sort((a,b)=>b.at-a.at).slice(0,5).map(b=>`<div class="row"><span style="color:var(--fg)">${esc(b.name)}</span>${pill(b.st,t().sts[b.st])}</div>`).join("")}</div></div>`},
bk(){return `<div class="c"><div class="tb"><input type="search" id="q" placeholder="${t().q}" value="${esc(flt.q)}" aria-label="${t().q}"><select id="f"><option value="">${t().all}</option>${Object.entries(t().sts).map(([k,v])=>`<option value="${k}"${flt.f===k?" selected":""}>${v}</option>`).join("")}</select><button class="btn o" id="ex">${t().exp}</button></div><div class="tw"><table><thead><tr>${t().cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody id="bkb"></tbody></table></div></div>`},
pj(){const PL=[...data.P].filter(p=>!pf||(pf==="act"?p.s<7:p.s===7)).sort((a,b)=>a.s-b.s);return `<div class="tb"><select id="pf" aria-label="filter">${opt([["",t().pAll],["act",t().pAct],["done",t().pDone]],pf)}</select></div>${PL.length?`<div class="g g3">${PL.map((p,i)=>{const pd=paidOf(data.P.indexOf(p)),dl=Math.round((p.at+365*864e5-Date.now())/864e5);return `<div class="c pj"><h3>${esc(p.n)}</h3><div class="m"><span>${esc(p.c)}</span><span>${t().stg[p.s-1]}</span></div><div class="seg">${t().stg.map((_,j)=>`<i class="${j+1<p.s?"d":j+1===p.s?"n":""}"></i>`).join("")}</div><div class="bar"><i style="width:${Math.round(pd/p.t*100)}%"></i></div><div class="m"><span>${t().paid}: <span class="ltr">${money(pd)} ${t().of} ${money(p.t)}</span></span></div><div class="m" style="margin-top:8px"><span>${t().due}</span><span style="color:${dl<0?"var(--bad)":"inherit"}">${dl<0?t().ovr:dl+" "+t().left}</span></div></div>`}).join("")}</div>`:`<div class="empty">${t().none}</div>`}`},
py(){const sum=s=>data.Y.filter(y=>y.st===s).reduce((a,y)=>a+y.a,0);
return `<div class="g g4" style="grid-template-columns:repeat(3,1fr)">${[["col","paid"],["pen","due"],["lt","late"]].map(([l,s])=>`<div class="c kpi"><b${s==="late"?' style="color:var(--bad)"':""}>${money(sum(s))}</b><span>${t()[l]}</span></div>`).join("")}</div><div class="tb mt"><select id="yf" aria-label="filter">${opt([["",t().yAll],...Object.entries(t().pst)],yf)}</select></div><div class="c"><div class="tw"><table><thead><tr>${t().pc.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${[...data.Y].filter(y=>!yf||y.st===yf).sort((a,b)=>b.at-a.at).map(y=>`<tr><td>${esc(data.P[y.p].c)}</td><td>${t().pd[y.d]}</td><td><span class="ltr"><b>${money(y.a)}</b></span></td><td>${dt(y.at,{day:"numeric",month:"short",year:"numeric"})}</td><td>${pill(y.st,t().pst[y.st])}</td></tr>`).join("")}</tbody></table></div></div>`},
st(){return `<div class="c" style="max-width:640px"><h2>${t().sI}</h2><div class="s"></div><div class="row"><span>${t().sN}</span><span class="wm" style="font-size:20px"><b>Entilaaqa</b><em>.com</em></span></div><div class="row"><span>${t().sS}</span><span class="ltr">${CFG.session}</span></div><div class="row" style="align-items:center"><span>${t().sA}</span><input type="text" id="api" class="ltr" value="${esc(S.g("api")||CFG.api)}" style="direction:ltr;min-width:220px"></div><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="sv">${t().sSv}</button><button class="btn o" id="rs">${t().sR}</button></div></div>`}};
function drawBk(){const q=flt.q.trim().toLowerCase(),l=data.B.filter(b=>(!flt.f||b.st===flt.f)&&(!q||(b.name+b.wa+b.mail).toLowerCase().includes(q))).sort((a,b)=>b.at-a.at);$("#bkb").innerHTML=l.length?rows(l):`<tr><td colspan="6" class="empty">${t().none}</td></tr>`}
function page(){const h=(location.hash||"#ov").slice(1),k=V[h]?h:"ov",d=document.documentElement,tt=t();
d.lang=L;d.dir=L==="ar"?"rtl":"ltr";
$("#out").textContent=tt.out;$("#ttl").textContent=tt.st[keys.indexOf(k)];
$("#nav").innerHTML=keys.map((x,i)=>`<div class="ni${x===k?" cur":""}"><div class="nr"><a href="#${x}" class="${x===k?"on":""}"${x===k?' aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[x]}</svg>${tt.nav[i]}</a><button type="button" class="cv" aria-label="${tt.nav[i]}" aria-expanded="false"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"/></svg></button></div><div class="dd" role="menu">${menu(x).map(m=>`<button type="button" role="menuitem" data-a="${m.a}" data-v="${m.v}">${m.l}${m.n!=null?`<small>${m.n}</small>`:""}</button>`).join("")}</div></div>`).join("");

document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
$("#v").innerHTML=V[k]();
if(k==="bk")drawBk();closeNav();document.title=tt.st[keys.indexOf(k)]+" · Entilaaqa.com";if(pend){const f=pend;pend=null;f()}}
const opt=(a,c)=>a.map(([v,l])=>`<option value="${v}"${v===c?" selected":""}>${l}</option>`).join("");
function exportCsv(){const r=[[...t().cols]].concat(data.B.map(b=>[b.name,b.wa,b.mail,t().inc[b.inc],t().rdy[b.rdy],t().sts[b.st],new Date(b.at).toISOString().slice(0,10)]));const c="\ufeff"+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv;charset=utf-8"}));a.download="entilaaqa-bookings.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function resetDemo(){data=demo();page();toast(t().sOk)}
function menu(k){const tt=t(),B=data.B,c=q=>B.filter(b=>b.st===q).length;
if(k==="ov")return[{l:tt.trk,a:"sc",v:"trk"},{l:tt.rev,a:"sc",v:"rv"},{l:tt.late,a:"sc",v:"lt"}];
if(k==="bk")return[{l:tt.allB,a:"bf",v:"",n:B.length}].concat(Object.entries(tt.sts).map(([q,l])=>({l,a:"bf",v:q,n:c(q)})),[{l:tt.exp,a:"ex",v:""}]);
if(k==="pj")return[{l:tt.pAll,a:"pf",v:"",n:data.P.length},{l:tt.pAct,a:"pf",v:"act",n:data.P.filter(p=>p.s<7).length},{l:tt.pDone,a:"pf",v:"done",n:data.P.filter(p=>p.s===7).length}];
if(k==="py")return[{l:tt.yAll,a:"yf",v:"",n:data.Y.length}].concat(Object.entries(tt.pst).map(([q,l])=>({l,a:"yf",v:q,n:data.Y.filter(y=>y.st===q).length})));
return[{l:tt.sA,a:"fa",v:""},{l:tt.sR,a:"rs",v:""}]}
function go(v,cb){pend=cb||null;if((location.hash||"#ov")==="#"+v)page();else location.hash=v}
function act(a,v){
if(a==="sc")go("ov",()=>{const e=$("#"+v);if(e&&e.scrollIntoView)e.scrollIntoView({behavior:"smooth",block:"start"})});
else if(a==="bf"){flt.f=v;flt.q="";go("bk")}
else if(a==="ex")exportCsv();
else if(a==="pf"){pf=v;go("pj")}
else if(a==="yf"){yf=v;go("py")}
else if(a==="fa")go("st",()=>{const e=$("#api");if(e){if(e.scrollIntoView)e.scrollIntoView({block:"center"});e.focus()}});
else if(a==="rs")resetDemo()}
function closeNav(){$("#sb").classList.remove("open");$("#sc").classList.remove("on")}
function closeDD(){document.querySelectorAll(".ni.open").forEach(n=>{n.classList.remove("open");n.querySelector(".cv").setAttribute("aria-expanded","false")})}
function place(d){d.style.insetInlineStart="";d.style.insetInlineEnd="";const r=d.getBoundingClientRect();if(r.left<8||r.right>innerWidth-8){d.style.insetInlineStart="auto";d.style.insetInlineEnd="-10px"}}
$("#nav").addEventListener("mouseleave",()=>$("#nav").classList.remove("q"));
addEventListener("keydown",e=>{if(e.key==="Escape")closeDD()});
document.addEventListener("click",e=>{const x=e.target;
const mi=x.closest("[data-a]");if(mi){act(mi.dataset.a,mi.dataset.v);closeDD();$("#nav").classList.add("q");if(document.activeElement)document.activeElement.blur();return}
const cv=x.closest(".cv");if(cv){const n=cv.closest(".ni"),o=n.classList.contains("open");closeDD();if(!o){n.classList.add("open");cv.setAttribute("aria-expanded","true");place(n.querySelector(".dd"))}return}
if(!x.closest(".ni"))closeDD();
if(x.closest("#mb")){$("#sb").classList.add("open");$("#sc").classList.add("on");return}
if(x.id==="sc"){closeNav();return}
if(x.dataset.l){L=x.dataset.l;S.s("l",L);page()}
else if(x.id==="th"){const n=document.documentElement.dataset.t==="dark"?"light":"dark";document.documentElement.dataset.t=n;S.s("t",n)}
else if(x.closest(".st.has")){const b=x.closest(".st"),k=+b.dataset.s;sel=sel===k?0:k;$("#trk").outerHTML=track()}
else if(x.id==="ex")exportCsv();
else if(x.id==="sv"){S.s("api",$("#api").value.trim()||CFG.api);toast(t().sOk);load()}
else if(x.id==="rs")resetDemo()});
document.addEventListener("input",e=>{if(e.target.id==="q"){flt.q=e.target.value;drawBk()}});
document.addEventListener("change",e=>{const x=e.target;
if(x.id==="f"){flt.f=x.value;drawBk()}
else if(x.id==="pf"){pf=x.value;page()}
else if(x.id==="yf"){yf=x.value;page()}
else if(x.dataset.id!==undefined){const b=data.B.find(b=>b.id==x.dataset.id);if(b){b.st=x.value;x.className="p-"+b.st;toast(t().saved)}}});
addEventListener("hashchange",page);
async function load(){if(location.protocol==="file:")return;
const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
try{const r=await fetch(S.g("api")||CFG.api,{headers:{Accept:"application/json"},credentials:"same-origin",signal:ac.signal});
if(!r.ok||!(r.headers.get("content-type")||"").includes("json"))throw 0;
const j=await r.json(),a=Array.isArray(j)?j:(j.bookings||j.data);if(!Array.isArray(a))throw 0;
data.B=a.map((r,i)=>({id:i,name:r.name||r.full_name||"–",wa:r.whatsapp||r.wa||r.phone||"–",mail:r.email||"–",inc:Math.max(0,(+r.income||1)-1),rdy:Math.max(0,(+r.ready||1)-1),st:r.status||"new",at:Date.parse(r.created_at||r.at||"")||Date.now()}));
data.live=true;page()}catch(e){}finally{clearTimeout(to)}}
document.documentElement.dataset.t=S.g("t")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
page();load();
</script>
</body>
</html>
