:root{--bg:#fff;--fg:#0a0a0a;--mut:#6b6b6b;--line:#e6e6e6;--soft:#f5f5f5;--nav:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}

.rl i{position:absolute;top:0;bottom:0;inset-inline-start:0;width:var(--p);background:linear-gradient(90deg,var(--fg),var(--mut));border-radius:9px;transition:width .8s cubic-bezier(.4,0,.2,1),height .8s cubic-bezier(.4,0,.2,1)}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0 6px}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--bg);color:var(--mut);transition:.4s}
.dot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st:hover .dot{border-color:var(--fg);transform:translateY(-3px)}

.tt{font-weight:700;font-size:14.5px;line-height:1.4;color:var(--mut);transition:.3s}

.bd{font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 10px;min-height:20px;border:1px solid transparent;transition:.3s}
